# Publish the documentation in docs/ to GitHub Pages.
#
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# After that this runs on every push to main that touches the docs.
#
# The docs are generated artifacts committed to the repo, so this workflow only uploads
# them — it does not rebuild. The `verify` job re-runs the generators and fails if the
# committed output is stale, which keeps docs/ honest without making the deploy depend on
# a successful build.
name: docs

on:
  push:
    branches: [main]
    # Every input the doc generators read, not just docs/. extract-tokens.mjs runs
    # girih's own engine over examples/acme-ds and extract-diagnostics.mjs greps
    # packages/*/src, so a change in either can make committed docs/ stale — and a
    # docs-only filter would leave the staleness gate blind to exactly that.
    paths:
      - 'docs/**'
      - 'packages/*/src/**'
      - 'examples/acme-ds/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; cancel a queued one rather than an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    name: verify committed docs are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # One script rather than the five steps this used to spell out, so CI and the
      # documented local command cannot drift: build, generate the example (its emitted
      # CSS is gitignored and the token extractor reads it), extract, then build pages.
      - run: pnpm docs:generate

      - name: fail if the committed docs differ from a fresh build
        run: |
          if ! git diff --quiet -- docs/; then
            echo "::error::docs/ is stale. Run \`pnpm docs:generate\` and commit the result."
            git diff --stat -- docs/
            exit 1
          fi
          echo "docs/ is up to date."

  deploy:
    name: deploy to Pages
    runs-on: ubuntu-latest
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement turns Pages on if it is not already, instead of failing with
      # "Get Pages site failed … verify that the repository has Pages enabled". That
      # error is only ever a missing one-time setting, and needing a human to click it
      # before the workflow can ever succeed is a worse first run than doing it here.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
