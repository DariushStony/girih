# Publish the documentation in docs/ to GitHub Pages.
#
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
#
# Called by release.yml as the second stage of the pipeline (ci → docs → release), so it
# has no push trigger of its own — the paths filter it used to need is now just "did ci
# pass on this commit".
#
# The docs are generated artifacts committed to the repo, so this workflow only uploads
# them — it does not rebuild. The `verify` job re-runs the generators and fails if the
# committed output is stale, which keeps docs/ honest without making the deploy depend on
# a successful build.
name: docs

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; cancel a queued one rather than an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    name: verify committed docs are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # One script rather than the five steps this used to spell out, so CI and the
      # documented local command cannot drift: build, generate the example (its emitted
      # CSS is gitignored and the token extractor reads it), extract, then build pages.
      - run: pnpm docs:generate

      # Structural checks on the built pages — dead links, anchors pointing at nothing,
      # unbalanced tags. Ran nowhere until now, so a broken cross-page anchor could ship.
      - run: pnpm docs:verify

      - name: fail if the committed docs differ from a fresh build
        run: |
          if ! git diff --quiet -- docs/; then
            echo "::error::docs/ is stale. Run \`pnpm docs:generate\` and commit the result."
            git diff --stat -- docs/
            exit 1
          fi
          echo "docs/ is up to date."

  deploy:
    name: deploy to Pages
    runs-on: ubuntu-latest
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # No `enablement: true` here, deliberately. It looks like the fix for "Get Pages
      # site failed", but the action documents that it "requires a token other than
      # GITHUB_TOKEN" — creating a Pages site needs administration:write, which the
      # workflow token cannot be granted. Setting it turns a clear "Pages is not
      # enabled" into a misleading "Resource not accessible by integration", and the
      # only way to make it work is storing a PAT with `repo` scope as a secret, which
      # is far too much standing access to save one click.
      #
      # Enabling Pages is a genuine one-time manual step:
      #   Settings → Pages → Build and deployment → Source: GitHub Actions
      # Until it is done this job fails, which is the honest outcome — the deploy
      # really is not configured. The `verify` job above still gates docs staleness.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
