# Keep a release pull request open, describing what the next version would be.
#
# On every push to main this recomputes the version from the conventional commits since
# the last tag, applies every edit a release needs, and opens or updates a single PR. You
# read the computed version and the generated notes, merge, and merging is what publishes
# — release.yml recognises the resulting `chore(release): X.Y.Z` commit.
#
# Nothing about a version is typed by hand, which is the point: the two failed dispatches
# that preceded this were both a hand-typed number disagreeing with the manifests.
name: release-pr

on:
  push:
    branches: [main]
  workflow_dispatch:

# One release PR at a time; a second run would fight the first over the same branch.
concurrency:
  group: release-pr
  cancel-in-progress: true

permissions:
  contents: write # push the release branch
  pull-requests: write # open and update the PR

jobs:
  prepare:
    # Skip the commit the previous release produced, or merging the PR would immediately
    # open another one proposing a bump on top of the bump.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # release-prepare measures from the last v* tag, which needs full history.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - id: plan
        name: compute the next version
        run: node scripts/release-prepare.mjs --json --dry-run > plan.json && cat plan.json >> "$GITHUB_STEP_SUMMARY"

      - id: read
        run: |
          echo "releasable=$(node -p "require('./plan.json').releasable")" >> "$GITHUB_OUTPUT"
          echo "next=$(node -p "require('./plan.json').next")" >> "$GITHUB_OUTPUT"
          echo "bump=$(node -p "require('./plan.json').bump")" >> "$GITHUB_OUTPUT"
          rm plan.json

      - name: apply the release edits
        if: steps.read.outputs.releasable == 'true'
        run: |
          node scripts/release-prepare.mjs
          # The emitted package.json carries the runtime range and is embedded verbatim in
          # docs/data/tokens.json, so a bump makes the docs stale. Regenerating here keeps
          # the PR passing its own docs gate.
          pnpm docs:generate

      - name: open or update the release PR
        if: steps.read.outputs.releasable == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: release/next
          # Recreate rather than accumulate: the branch always holds exactly one commit
          # describing the current state of main, not a pile of superseded bumps.
          delete-branch: true
          commit-message: 'chore(release): ${{ steps.read.outputs.next }}'
          title: 'chore(release): ${{ steps.read.outputs.next }}'
          labels: release
          body: |
            Merging this publishes **${{ steps.read.outputs.next }}** to npm.

            Computed from the conventional commits since the last `v*` tag — a
            `${{ steps.read.outputs.bump }}` bump under girih's pre-1.0 convention, where a
            breaking change moves the minor and a feature moves the patch.

            This branch contains the whole release: eight manifests, the two version ranges
            that ship inside published source, the changelogs, and regenerated docs. Nothing
            here was typed by hand.

            **Check before merging**

            - the version is what you expect for the changes listed in `CHANGELOG.md`
            - anything breaking is genuinely breaking
            - `ci` and `docs` are green on this PR

            To hold a release back, leave this open — it updates itself on every push to
            main.
