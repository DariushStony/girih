# The pipeline: ci → docs → release.
#
# Runs on every push to main. The first two stages are the same reusable workflows a pull
# request runs, so "passing CI" means one thing everywhere. The third publishes to npm,
# and only when the commit that landed is a release commit — which is what merging the
# release PR produces.
#
# The publish stage deliberately re-verifies nothing: ci and docs are its `needs`, so by
# the time it runs, lint, types, unit tests, cross-OS packaging, the tarball audit and the
# docs gate have all passed on this exact commit.
#
# One-time setup: an npm granular access token with publish rights on the `faravahar`
# scope, stored as the NPM_TOKEN secret.
name: release

on:
  push:
    branches: [main]
  # Manual re-run, for when a publish failed after the gates already passed.
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Resolve and pack everything, but do not publish'
        required: false
        default: true
        type: boolean

# Never two pipelines on main at once: they would race on the same version numbers.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  docs:
    needs: ci
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  # Is this commit a release? `chore(release): X.Y.Z` is what release-pr.yml writes and
  # merging that PR is the only thing that produces it, so the shape is the signal.
  detect:
    needs: docs
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - id: check
        run: |
          subject=$(git log -1 --format=%s)
          version=$(node -p "require('./packages/girih/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [ '${{ github.event_name }}' = 'workflow_dispatch' ]; then
            echo "Dispatched manually — publishing $version."
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "$subject" in
            "chore(release): $version")
              echo "Release commit for $version."
              echo "publish=true" >> "$GITHUB_OUTPUT"
              ;;
            "chore(release):"*)
              # A release commit whose subject and manifests disagree means someone
              # edited one of them by hand. Refuse rather than publish the wrong number.
              echo "::error::commit says '$subject' but the manifests say $version"
              exit 1
              ;;
            *)
              echo "Not a release commit — nothing to publish."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

  publish:
    needs: detect
    if: needs.detect.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # to push the version tag
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # Writes the .npmrc that pnpm reads NODE_AUTH_TOKEN through.
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # prepublishOnly builds each package, but building here too means a broken build
      # fails before anything touches the registry rather than midway through publishing.
      - run: pnpm build

      # Refuse a version that is already on npm. npm would reject it anyway, but only
      # after publishing whichever packages come earlier in the topological order —
      # leaving the release half-done.
      - name: check the version is unpublished
        run: |
          version='${{ needs.detect.outputs.version }}'
          fail=0
          for manifest in packages/*/package.json; do
            node -p "require('./$manifest').private === true" | grep -q true && continue
            name=$(node -p "require('./$manifest').name")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "::error::$name@$version is already published"
              fail=1
            fi
          done
          [ "$fail" = "0" ] || exit 1
          echo "$version is unpublished everywhere."

      # Exercises pnpm's real manifest rewriting — unlike `npm whoami`, which proves
      # nothing about the path the publish actually takes.
      - name: dry run
        run: pnpm -r --filter "./packages/*" publish --access public --no-git-checks --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # pnpm, never npm: five packages depend on each other by `workspace:*`, and only
      # pnpm's packer rewrites those into real version ranges. npm ships them verbatim
      # and every consumer install fails with EUNSUPPORTEDPROTOCOL.
      #
      # --no-git-checks because a runner checkout is a detached HEAD, which pnpm's branch
      # check rejects; the detect job is the real guard.
      - name: publish
        if: ${{ github.event_name == 'push' || !inputs.dry-run }}
        run: pnpm -r --filter "./packages/*" publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The tag is what release-prepare measures the next release from, so it has to
      # exist or every subsequent bump reconsiders the whole history.
      - name: tag
        if: ${{ github.event_name == 'push' || !inputs.dry-run }}
        run: |
          version='${{ needs.detect.outputs.version }}'
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "v$version" -m "v$version"
          git push origin "v$version"

      - name: summary
        run: |
          {
            version='${{ needs.detect.outputs.version }}'
            if [ '${{ github.event_name }}' = 'workflow_dispatch' ] && [ '${{ inputs.dry-run }}' = 'true' ]; then
              echo "### Dry run — nothing published"
            else
              echo "### Published $version"
            fi
            echo
            for manifest in packages/*/package.json; do
              node -e "
                const p = require('./$manifest');
                if (p.private) process.exit(0);
                console.log('- \`' + p.name + '@' + p.version + '\`');
              "
            done
          } >> "$GITHUB_STEP_SUMMARY"
