# The pipeline: ci → docs → release.
#
# Every push to main runs the same two reusable workflows a pull request runs, then — if
# the commits since the last tag warrant it — computes the next version, commits the bump,
# tags it, publishes to npm, and pushes. Nothing about a version is typed by hand, and
# there is no PR to merge: a `git pull` after a release brings down the bump commit and the
# tag.
#
# The release stage re-verifies nothing, because ci and docs are its `needs`: lint, types,
# unit tests, cross-OS packaging, the tarball audit and the docs gate have all passed on
# this exact commit.
#
# One-time setup: an npm granular access token with publish rights on the `faravahar`
# scope, stored as the NPM_TOKEN secret.
name: release

on:
  push:
    branches: [main]
  # Manual re-run, for a publish that failed after the gates already passed.
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Compute and pack everything, but neither publish nor push'
        required: false
        default: true
        type: boolean

# Never two releases at once: they would race on the same version numbers.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  docs:
    needs: ci
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  release:
    needs: docs
    # Skip the commit the previous release produced, or publishing would trigger itself and
    # walk the version forward on every run.
    if: ${{ github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # commit the bump and push the tag
    steps:
      - uses: actions/checkout@v4
        with:
          # release-prepare measures from the last v* tag, so shallow history would make it
          # refuse. Tags included.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          # Writes the .npmrc that pnpm reads NODE_AUTH_TOKEN through.
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - id: plan
        name: compute the next version
        run: |
          node scripts/release-prepare.mjs --json --dry-run > plan.json
          cat plan.json
          {
            echo '### Release plan'
            echo
            echo '```json'
            cat plan.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "releasable=$(node -p "require('./plan.json').releasable")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./plan.json').next")" >> "$GITHUB_OUTPUT"
          rm plan.json

      # Everything below is conditional on there being something to release. A push with
      # only ci/docs/chore commits ends here, green.
      - name: apply the release edits
        if: steps.plan.outputs.releasable == 'true'
        run: |
          node scripts/release-prepare.mjs
          # The emitted package.json carries the runtime range and is embedded verbatim in
          # docs/data/tokens.json, so a bump makes the docs stale.
          pnpm docs:generate

      - name: rebuild at the new version
        if: steps.plan.outputs.releasable == 'true'
        run: pnpm build

      # Refuse a version already on npm rather than publishing the packages that come
      # earlier in the topological order and leaving the release half-done.
      - name: check the version is unpublished
        if: steps.plan.outputs.releasable == 'true'
        run: |
          version='${{ steps.plan.outputs.version }}'
          fail=0
          for manifest in packages/*/package.json; do
            node -p "require('./$manifest').private === true" | grep -q true && continue
            name=$(node -p "require('./$manifest').name")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "::error::$name@$version is already published"
              fail=1
            fi
          done
          [ "$fail" = "0" ] || exit 1

      - name: commit and tag
        if: steps.plan.outputs.releasable == 'true'
        run: |
          version='${{ steps.plan.outputs.version }}'
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "chore(release): $version"
          git tag -a "v$version" -m "v$version"

      # Publish before pushing, deliberately — the opposite of what feels natural.
      #
      # A failed publish must leave main untouched so the next push simply retries. If the
      # commit and tag went first, a publish failure would leave main claiming a version npm
      # never received, and every later run would then measure from the new tag and report
      # "nothing to release" — the release would be silently stuck. That inconsistency is
      # exactly what had to be repaired by hand before this automation existed.
      #
      # pnpm, never npm: five packages depend on each other by `workspace:*` and only pnpm's
      # packer rewrites those into real versions. npm ships them verbatim and every consumer
      # install fails with EUNSUPPORTEDPROTOCOL.
      - name: publish
        if: ${{ steps.plan.outputs.releasable == 'true' && (github.event_name == 'push' || !inputs.dry-run) }}
        run: pnpm -r --filter "./packages/*" publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: push the bump and the tag
        if: ${{ steps.plan.outputs.releasable == 'true' && (github.event_name == 'push' || !inputs.dry-run) }}
        run: git push origin HEAD:main --follow-tags

      - name: summary
        if: steps.plan.outputs.releasable == 'true'
        run: |
          {
            echo "### Published ${{ steps.plan.outputs.version }}"
            echo
            for manifest in packages/*/package.json; do
              node -e "
                const p = require('./$manifest');
                if (p.private) process.exit(0);
                console.log('- \`' + p.name + '@' + p.version + '\`');
              "
            done
          } >> "$GITHUB_STEP_SUMMARY"
