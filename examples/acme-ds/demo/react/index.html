<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>acme-ds — girih M3 React demo</title>
  <link rel="stylesheet" href="../../packages/design-system/styles/tokens.css" />
  <link rel="stylesheet" href="../../packages/design-system/styles/components.css" />
  <style>
    /* Demo chrome only. */
    body {
      margin: 0;
      font-family: var(--ds-typography-body-family);
      color: var(--ds-color-text);
      background: var(--ds-color-background);
    }
    .page { max-width: 640px; margin: 0 auto; padding: var(--ds-space-6); display: grid; gap: var(--ds-space-4); }
    .ds-card { display: grid; gap: var(--ds-space-3); }
    h1 { font-size: var(--ds-font-size-lg); margin: 0; }
    h2 { font-size: var(--ds-font-size-md); margin: 0; display: flex; gap: var(--ds-space-2); align-items: center; }
    p { margin: 0; color: var(--ds-color-text-muted); font-size: var(--ds-font-size-sm); }
    table { border-collapse: collapse; }
    th, td { padding: var(--ds-space-2); text-align: left; font-size: var(--ds-font-size-sm); }
    .row { display: flex; gap: var(--ds-space-2); flex-wrap: wrap; }
    .toggle { display: flex; gap: var(--ds-space-2); align-items: center; font-size: var(--ds-font-size-sm); }
    /* No .ds-button rules here — structure ships in components.css, design in tokens.css. */
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="./bundle.js"></script>
</body>
</html>
