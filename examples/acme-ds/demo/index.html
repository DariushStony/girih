<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>acme-ds — girih M2 demo</title>
    <!-- Generated by `girih generate css` — one stylesheet, every brand. -->
    <link rel="stylesheet" href="../packages/design-system/styles/tokens.css" />
    <style>
      /* Demo chrome only — every design decision below comes from generated tokens. */
      body {
        margin: 0;
        font-family: var(--ds-typography-body-family);
        color: var(--ds-color-text);
        background: var(--ds-color-background);
        display: grid;
        place-items: center;
        min-height: 100vh;
      }
      .card {
        background: var(--ds-color-surface);
        border: 1px solid var(--ds-color-border);
        border-radius: var(--ds-radius-lg);
        padding: var(--ds-space-6);
        display: grid;
        gap: var(--ds-space-4);
        width: min(90vw, 420px);
      }
      h1 {
        margin: 0;
        font-size: var(--ds-font-size-lg);
      }
      p {
        margin: 0;
        color: var(--ds-color-text-muted);
        font-size: var(--ds-font-size-sm);
      }
      .row {
        display: flex;
        gap: var(--ds-space-2);
        flex-wrap: wrap;
      }
      .btn {
        border: 1px solid transparent;
        border-radius: var(--ds-button-radius);
        height: var(--ds-button-size-md-height);
        padding: 0 var(--ds-space-4);
        font: inherit;
        font-weight: var(--ds-font-weight-medium);
        font-size: var(--ds-font-size-md);
        cursor: pointer;
      }
      .btn-primary {
        background: var(--ds-button-primary-background);
        color: var(--ds-button-primary-foreground);
      }
      .btn-primary:hover {
        background: var(--ds-button-primary-background-hover);
      }
      .btn-secondary {
        background: var(--ds-button-secondary-background);
        color: var(--ds-button-secondary-foreground);
        border-color: var(--ds-button-secondary-border);
      }
      .btn-danger {
        background: var(--ds-button-danger-background);
        color: var(--ds-button-danger-foreground);
      }
      .btn-danger:hover {
        background: var(--ds-button-danger-background-hover);
      }
      .toggle {
        display: flex;
        gap: var(--ds-space-2);
        align-items: center;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>One component set, two brands</h1>
      <p>
        Flipping <code>data-brand</code> on <code>&lt;html&gt;</code> swaps the seller overlay in — no rebuild, no second stylesheet. Note
        the radius change: seller overrides the <em>global</em> <code>radius.md</code>, and it cascades through
        <code>radius.control</code> into <code>button.radius</code>.
      </p>
      <div class="row">
        <button class="btn btn-primary">Save changes</button>
        <button class="btn btn-secondary">Cancel</button>
        <button class="btn btn-danger">Delete</button>
      </div>
      <label class="toggle">
        <input type="checkbox" id="brand-toggle" />
        Seller brand
      </label>
    </div>
    <script>
      document.getElementById('brand-toggle').addEventListener('change', (event) => {
        if (event.target.checked) {
          document.documentElement.dataset.brand = 'seller';
        } else {
          delete document.documentElement.dataset.brand;
        }
      });
    </script>
  </body>
</html>
